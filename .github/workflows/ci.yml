# Agent Millow CI.
#
# This workflow is configuration only. It has not been run in this repository
# and does not use repository secrets. The MySQL and application credentials
# below are disposable, job-local test values, not production credentials.
#
# It runs on a clean Linux runner, matching the production PHP/database family
# more closely than the Windows development host.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: agent_millow_test
          MYSQL_USER: agent_millow
          MYSQL_PASSWORD: ci-only-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=30s

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: agent_millow_test
      DB_USERNAME: agent_millow
      DB_PASSWORD: ci-only-app-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, sqlite3, pdo_sqlite, bcmath, ctype, curl, dom, fileinfo, openssl, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear --ansi

      - name: Run Pint, PHPStan, PHPUnit, and offline evaluation
        run: composer --working-dir=backend run check

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint and type-check
        working-directory: frontend
        run: npm run check

      - name: Build static assets
        working-directory: frontend
        run: npm run build

  deployment-artifacts:
    name: Deployment artifact checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate smoke-test shell syntax
        run: bash -n scripts/production-smoke-test.sh

      - name: Confirm production templates contain no committed secrets
        run: |
          if grep -RInE 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|sk-[A-Za-z0-9]{20,}' backend/.env.production.example deploy docs/deployment.md; then
            echo "Potential secret material found in deployment templates."
            exit 1
          fi
          if grep -nE '^(APP_KEY|DB_PASSWORD|MAIL_PASSWORD|AGENT_MILLOW_OPENAI_KEY|AGENT_MILLOW_SEED_ADMIN_PASSWORD)=[^[:space:]]+' backend/.env.production.example; then
            echo "Sensitive production template values must remain empty."
            exit 1
          fi

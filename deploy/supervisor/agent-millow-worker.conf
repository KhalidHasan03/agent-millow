; Agent Millow queue worker.
;
; Install as /etc/supervisor/conf.d/agent-millow-worker.conf, then:
;   supervisorctl reread
;   supervisorctl update
;   supervisorctl status agent-millow-worker:*
;
; The worker listens on the provider queue first, then the default queue. The
; worker timeout is deliberately below the database queue retry_after (90s) so
; a stuck job cannot be retried while the first worker is still running it.
; Job-level retries and backoff are defined in GenerateAssistantReply.
;
; Do not place provider keys or database credentials in this file. Laravel reads
; backend/.env as the www-data user.

[program:agent-millow-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/agent-millow/current/backend/artisan queue:work --queue=provider,default --sleep=3 --tries=3 --timeout=75 --max-time=3600 --max-jobs=500
directory=/var/www/agent-millow/current/backend
autostart=true
autorestart=true
startsecs=5
startretries=5
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/agent-millow/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
stopwaitsecs=120

; Agent Millow PHP-FPM pool.
;
; Install as /etc/php/8.4/fpm/pool.d/agent-millow.conf, then validate with
; php-fpm8.4 -t and reload the service. The socket path must match the Nginx
; FastCGI snippet. Tune pm.max_children to the host's memory and CPU budget.
;
; This pool deliberately clears inherited environment variables. Laravel reads
; backend/.env (or an equivalent injected configuration file). Do not place
; secrets directly in this pool file.

[agent-millow]
user = www-data
group = www-data

listen = /run/php/agent-millow.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
pm.max_requests = 500

request_terminate_timeout = 300s
request_slowlog_timeout = 5s
slowlog = /var/log/php8.4-fpm-agent-millow-slow.log

access.log = /var/log/php8.4-fpm-agent-millow.access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilo}M %C%%"

catch_workers_output = yes
decorate_workers_output = no

clear_env = yes
security.limit_extensions = .php

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm-agent-millow.error.log

php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
php_admin_value[post_max_size] = 2M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[max_input_time] = 60

php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.use_strict_mode] = 1

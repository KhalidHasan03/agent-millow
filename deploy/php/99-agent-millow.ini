; Agent Millow production PHP settings.
;
; Install as /etc/php/8.4/fpm/conf.d/99-agent-millow.ini and reload PHP-FPM.
; These settings are the runtime baseline. Application limits and Laravel
; configuration remain authoritative for API behavior.
;
; With opcache.validate_timestamps disabled, every code deployment must reload
; PHP-FPM so the new release is loaded.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

memory_limit = 256M
max_execution_time = 300
max_input_time = 60
post_max_size = 2M
upload_max_filesize = 2M
max_input_vars = 1000

date.timezone = UTC

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

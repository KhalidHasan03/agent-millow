# Install as /etc/nginx/snippets/agent-millow-fastcgi.conf.
# The socket path must match deploy/php-fpm/agent-millow.conf.

include fastcgi_params;

fastcgi_param SCRIPT_FILENAME /var/www/agent-millow/current/backend/public/index.php;
fastcgi_param DOCUMENT_ROOT /var/www/agent-millow/current/backend/public;
fastcgi_param HTTPS on;
fastcgi_param HTTP_PROXY "";
fastcgi_param HTTP_X_REQUEST_ID $request_id;

fastcgi_pass unix:/run/php/agent-millow.sock;

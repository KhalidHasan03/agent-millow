# Agent Millow production Nginx site.
#
# Install as /etc/nginx/sites-available/agent-millow.conf and enable with a
# symlink in /etc/nginx/sites-enabled/. Install the companion FastCGI snippet
# as /etc/nginx/snippets/agent-millow-fastcgi.conf. Replace app.example.com,
# certificate paths, and the release path before enabling.
#
# This file assumes the frontend is served from the same origin as the API.
# Keep the application and the SPA on one hostname so Sanctum cookies and CSRF
# protection remain first-party.

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    root /var/www/agent-millow/current/frontend/dist;
    index index.html;

    server_tokens off;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:AgentMillowTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Enable only after HTTPS, redirects, and cookies are verified end to end.
    # Keep AGENT_MILLOW_HSTS_ENABLED=false when Nginx owns this header.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    access_log /var/log/nginx/agent-millow.access.log;
    error_log /var/log/nginx/agent-millow.error.log warn;

    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # API routes execute Laravel. A normal prefix is used so the more specific
    # streaming regex below can take precedence.
    location /api/ {
        include /etc/nginx/snippets/agent-millow-fastcgi.conf;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Streaming responses must not be buffered by Nginx. Nginx evaluates this
    # regex before the plain /api/ prefix location.
    location ~ ^/api/v1/conversations/[0-9]+/stream$ {
        include /etc/nginx/snippets/agent-millow-fastcgi.conf;
        fastcgi_buffering off;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ^~ /sanctum/ {
        include /etc/nginx/snippets/agent-millow-fastcgi.conf;
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
    }

    location = /up {
        include /etc/nginx/snippets/agent-millow-fastcgi.conf;
        access_log off;
        fastcgi_read_timeout 10s;
        fastcgi_send_timeout 10s;
    }

    location = /index.html {
        expires -1;
    }

    # Vite emits hashed assets under /assets. Restrict static caching to that
    # prefix so paths under /api are never resolved as files.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    location = /favicon.svg {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
